services:
  backend:
    build: ./backend
    expose: ["8000"]
    env_file: .env
    environment:
      INDEX_DIR: /data/index
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data/index:/data/index
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
