[project]
name = "seevu-rag-backend"
version = "0.1.0"
description = "FastAPI backend for RAG Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu==1.11.0.post1",
    "fastapi>=0.115.0",
    "numpy>=2.0.0",
    "openai>=1.40.0",
    "pydantic-settings>=2.4.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.9",
    "tiktoken>=0.7.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
